# Semantic search golden matrix — GIM-922
#
# Row schema:
#   id:                     unique string key
#   split:                  dev | holdout | live_probe
#   class:                  mandatory | advisory | no_answer
#   query:                  natural-language search string
#   projects:               list of project slugs (or ["__fixture__"] for fixture mode)
#   source_scopes:          null = defaults (project + workspace_package), or list of scope strings
#   top_k:                  number of results to retrieve and evaluate
#   must_match_all_in_top_n: every pattern group must have at least one hit in the top-n window
#   must_match_any_in_top_n: at least one pattern group must have at least one hit in the top-n window
#   must_not_match_in_top_n: no hit in the top-n window may match any listed pattern
#   min_hits:               minimum returned_count for the row to be considered executed
#   max_noise_hits:         max hits that match no relevant pattern (null = unlimited)
#   required_context_status: null | "present" | "absent"
#   row_pass_rule:          "all" = all constraint groups must pass
#   description:            human-readable purpose
#   tags:                   list of strings for grouping in reports
#
# Pattern matching: fnmatch-style against qualified_name and file_path fields.
# Each criterion item: {patterns: [...], n: <window size, defaults to top_k>}
# Patterns are OR-d within a criterion, AND-d across criteria.

version: "1"

rows:

  # ── DEV ROWS ────────────────────────────────────────────────────────────────

  - id: "dev-core-timers-schedulers"
    split: "dev"
    class: "mandatory"
    query: "timer scheduler repeating task"
    projects: ["__fixture__"]
    source_scopes: null
    top_k: 5
    must_match_any_in_top_n:
      - patterns:
          - "*Timer*"
          - "*Scheduler*"
          - "*schedule*"
          - "*timer*"
          - "*repeating*"
          - "*periodic*"
        n: 5
    must_not_match_in_top_n:
      - patterns:
          - "*/DerivedData/*"
          - "*/.palace-scip-derived-data/*"
        n: 5
    min_hits: 1
    max_noise_hits: null
    required_context_status: null
    row_pass_rule: "all"
    description: "Core iOS timer/scheduler pattern lookup"
    tags: ["core_product", "ios"]

